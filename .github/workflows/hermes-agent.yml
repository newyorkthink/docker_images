name: Build Hermes Agent

on:
  push:
    branches:
      - main
    paths:
      - hermes-agent/Dockerfile
      - hermes-agent/docker/**
      - hermes-agent/.dockerignore
      - .github/workflows/hermes-agent.yml
  schedule:
    # 每 6 小时检查一次上游镜像；digest 未变化时直接结束，不执行完整构建。
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: hermes-agent-ghcr
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 禁止 docker/build-push-action 上传 .dockerbuild 构建记录 artifact。
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream image
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          upstream_image="docker.io/nousresearch/hermes-agent:latest"
          target_image="ghcr.io/newyorkthink/hermes-agent:latest"

          upstream_digest="$(docker buildx imagetools inspect "${upstream_image}" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
          [[ "${upstream_digest}" == sha256:* ]] || {
            echo "无法读取上游镜像 digest。"
            exit 1
          }

          current_base_digest=""
          if current_image="$(docker buildx imagetools inspect "${target_image}" --format '{{json .Image}}' 2>/dev/null)"; then
            current_base_digest="$(jq -r '
              if .config? then
                .config.Labels["org.opencontainers.image.base.digest"] // empty
              else
                [ .[]? | .config?.Labels?["org.opencontainers.image.base.digest"] // empty ]
                | map(select(length > 0))
                | first // empty
              end
            ' <<<"${current_image}")"
          fi

          echo "digest=${upstream_digest}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "仓库变更或手动触发：执行构建。"
          elif [[ "${current_base_digest}" == "${upstream_digest}" ]]; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "上游镜像未更新：跳过构建。"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "检测到上游镜像更新：执行构建。"
          fi

      - name: Build and push latest
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./hermes-agent
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          tags: ghcr.io/newyorkthink/hermes-agent:latest
          labels: org.opencontainers.image.source=https://github.com/newyorkthink/docker_images
          build-args: |
            UPSTREAM_DIGEST=${{ steps.upstream.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
