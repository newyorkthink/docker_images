name: Build whisper.cpp

on:
  push:
    paths:
      - 'whisper-cpp/**'
      - '.github/workflows/whisper-cpp.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push whisper.cpp
        uses: docker/build-push-action@v7
        with:
          context: ./whisper-cpp
          push: true
          platforms: linux/amd64
          tags: ghcr.io/newyorkthink/whisper-cpp:latest
          labels: org.opencontainers.image.source=https://github.com/newyorkthink/docker_images
          cache-from: type=gha
          cache-to: type=gha,mode=max
