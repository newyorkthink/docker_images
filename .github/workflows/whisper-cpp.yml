name: Build whisper.cpp

on:
  push:
    paths:
      - 'whisper-cpp/**'
      - '.github/workflows/whisper-cpp.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout upstream whisper.cpp
        uses: actions/checkout@v7
        with:
          repository: ggml-org/whisper.cpp
          path: whisper-cpp/upstream
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push whisper.cpp CPU
        uses: docker/build-push-action@v7
        with:
          context: ./whisper-cpp/upstream
          file: ./whisper-cpp/main.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/newyorkthink/whisper-cpp:latest
            ghcr.io/newyorkthink/whisper-cpp:cpu
          labels: org.opencontainers.image.source=https://github.com/newyorkthink/docker_images
          cache-from: type=gha,scope=whisper-cpp-cpu
          cache-to: type=gha,mode=max,scope=whisper-cpp-cpu

      - name: Build and push whisper.cpp Vulkan
        uses: docker/build-push-action@v7
        with:
          context: ./whisper-cpp/upstream
          file: ./whisper-cpp/main-vulkan.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/newyorkthink/whisper-cpp:vulkan
          labels: org.opencontainers.image.source=https://github.com/newyorkthink/docker_images
          cache-from: type=gha,scope=whisper-cpp-vulkan
          cache-to: type=gha,mode=max,scope=whisper-cpp-vulkan
