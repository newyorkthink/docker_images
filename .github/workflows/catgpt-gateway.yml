name: Build CatGPT Gateway

on:
  push:
    branches:
      - main
    paths:
      - catgpt-gateway/**
      - .github/workflows/catgpt-gateway.yml
  schedule:
    # 每 6 小时检查一次上游 main；提交未变化时直接结束，不执行构建。
    - cron: '29 */6 * * *'
  workflow_dispatch:

concurrency:
  group: catgpt-gateway-ghcr
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 禁止 docker/build-push-action 上传 .dockerbuild 构建记录 artifact。
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          upstream_repo="https://github.com/GautamVhavle/CatGPT-Gateway.git"
          target_image="ghcr.io/newyorkthink/catgpt-gateway:latest"

          upstream_sha="$(git ls-remote "${upstream_repo}" refs/heads/main | awk '{print $1}')"
          [[ "${upstream_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "无法读取上游 main 提交。"
            exit 1
          }

          current_revision=""
          if current_image="$(docker buildx imagetools inspect "${target_image}" --format '{{json .Image}}' 2>/dev/null)"; then
            current_revision="$(jq -r '
              if .config? then
                .config.Labels["org.opencontainers.image.revision"] // empty
              else
                [ .[]? | .config?.Labels?["org.opencontainers.image.revision"] // empty ]
                | map(select(length > 0))
                | first // empty
              end
            ' <<<"${current_image}")"
          fi

          echo "sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "仓库变更或手动触发：执行构建。"
          elif [[ "${current_revision}" == "${upstream_sha}" ]]; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "上游 main 未更新：跳过构建。"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "检测到上游 main 更新：执行构建。"
          fi

      - name: Build and push latest
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: https://github.com/GautamVhavle/CatGPT-Gateway.git#${{ steps.upstream.outputs.sha }}
          push: true
          pull: true
          platforms: linux/amd64
          tags: ghcr.io/newyorkthink/catgpt-gateway:latest
          labels: |
            org.opencontainers.image.source=https://github.com/newyorkthink/docker_images
            org.opencontainers.image.url=https://github.com/GautamVhavle/CatGPT-Gateway
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha,scope=catgpt-gateway
          cache-to: type=gha,mode=max,scope=catgpt-gateway
          provenance: false
          sbom: false
