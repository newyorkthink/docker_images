name: Build CatGPT Gateway

on:
  push:
    branches:
      - main
    paths:
      - catgpt-gateway/**
      - .github/workflows/catgpt-gateway.yml
  schedule:
    # 每 6 小时检查一次上游 main；提交未变化时直接结束，不执行构建。
    - cron: '29 */6 * * *'
  workflow_dispatch:

concurrency:
  group: catgpt-gateway-ghcr
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 禁止 docker/build-push-action 上传 .dockerbuild 构建记录 artifact。
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          upstream_repo="https://github.com/GautamVhavle/CatGPT-Gateway.git"
          target_image="ghcr.io/newyorkthink/catgpt-gateway:latest"

          upstream_sha="$(git ls-remote "${upstream_repo}" refs/heads/main | awk '{print $1}')"
          [[ "${upstream_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "无法读取上游 main 提交。"
            exit 1
          }

          current_revision=""
          if current_image="$(docker buildx imagetools inspect "${target_image}" --format '{{json .Image}}' 2>/dev/null)"; then
            current_revision="$(jq -r '
              if .config? then
                .config.Labels["org.opencontainers.image.revision"] // empty
              else
                [ .[]? | .config?.Labels?["org.opencontainers.image.revision"] // empty ]
                | map(select(length > 0))
                | first // empty
              end
            ' <<<"${current_image}")"
          fi

          echo "sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "仓库变更或手动触发：执行构建。"
          elif [[ "${current_revision}" == "${upstream_sha}" ]]; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "上游 main 未更新：跳过构建。"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "检测到上游 main 更新：执行构建。"
          fi

      - name: Prepare upstream source
        if: steps.upstream.outputs.build == 'true'
        id: source
        shell: bash
        run: |
          set -euo pipefail

          source_dir="${GITHUB_WORKSPACE}/.catgpt-upstream"
          rm -rf "${source_dir}"
          git init -q "${source_dir}"
          git -C "${source_dir}" remote add origin "https://github.com/GautamVhavle/CatGPT-Gateway.git"
          git -C "${source_dir}" fetch -q --depth 1 origin "${{ steps.upstream.outputs.sha }}"
          git -C "${source_dir}" checkout -q --detach FETCH_HEAD

          python3 - "${source_dir}" <<'PY'
          from pathlib import Path
          import sys

          source_dir = Path(sys.argv[1])
          route_file = source_dir / "src/api/openai_routes.py"
          text = route_file.read_text(encoding="utf-8")

          definition_exists = (
              "def _increment_thread_count(" in text
              or "async def _increment_thread_count(" in text
          )
          call_line = "        _increment_thread_count()\n"

          if definition_exists:
              print("上游已恢复 _increment_thread_count 定义，无需本地补丁。")
          else:
              dangling_calls = text.count(call_line)
              if dangling_calls == 0:
                  print("上游已移除悬空 _increment_thread_count 调用，无需本地补丁。")
              else:
                  text = text.replace(call_line, "")
                  print(
                      f"已移除 {dangling_calls} 处无定义的 _increment_thread_count 调用。"
                  )

          generic_rule_anchor = (
              "5. Do not refuse or say tools are unavailable — "
              "they are available through this interface.\n"
          )
          generic_rule_replacement = (
              generic_rule_anchor
              + "6. The listed functions are real client-side tools. "
                "You do not need direct browser, filesystem, shell, or OS access "
                "to request them through this interface.\n"
              + "7. If the request depends on local machine state — including files, "
                "directories, repository contents, shell output, installed software, "
                "or the current working directory — call the relevant tool first. "
                "Do not guess, do not fabricate results, and do not merely tell the user "
                "which command to run.\n"
              + "8. When a relevant file, directory, repository, shell, or patch tool "
                "exists, use it for requests to inspect, read, list, search, modify, "
                "or execute against the local environment.\n"
          )

          if "6. The listed functions are real client-side tools." in text:
              print("上游工具调用提示词已包含本地工具规则，无需重复补丁。")
          elif generic_rule_anchor in text:
              text = text.replace(
                  generic_rule_anchor,
                  generic_rule_replacement,
                  1,
              )
              print("已增强工具调用提示词，明确本地文件/目录/shell 请求必须优先调用工具。")
          else:
              print("上游工具调用提示词结构已变化，跳过通用提示词补丁。")

          responses_anchor = (
              '                messages.insert(\n'
              '                    0, ChatMessage(role="system", content=tool_system)\n'
              '                )\n'
          )
          responses_replacement = (
              '                insert_at = 0\n'
              '                while (\n'
              '                    insert_at < len(messages)\n'
              '                    and messages[insert_at].role == "system"\n'
              '                ):\n'
              '                    insert_at += 1\n'
              '                messages.insert(\n'
              '                    insert_at, ChatMessage(role="system", content=tool_system)\n'
              '                )\n'
          )

          if responses_replacement in text:
              print("上游 Responses 工具提示词顺序已调整，无需重复补丁。")
          elif responses_anchor in text:
              text = text.replace(
                  responses_anchor,
                  responses_replacement,
                  1,
              )
              print("已将 Responses 工具提示词移动到现有系统指令之后、用户请求之前。")
          else:
              print("上游 Responses 工具提示词注入结构已变化，跳过顺序补丁。")

          persistent_anchor = (
              '    if not latest_msgs:\n'
              '        latest_msgs = [messages[-1]]\n'
              '    pruned_prompt = _build_prompt(latest_msgs)\n'
          )
          persistent_replacement = (
              '    if not latest_msgs:\n'
              '        latest_msgs = [messages[-1]]\n'
              '    if has_tool_prompt:\n'
              '        tool_system_msgs = [\n'
              '            msg for msg in messages\n'
              '            if msg.role == "system"\n'
              '            and isinstance(msg.content, str)\n'
              '            and (\n'
              '                "You are in tool-calling mode." in msg.content\n'
              '                or "You have access to external tools through a structured interface." in msg.content\n'
              '            )\n'
              '        ]\n'
              '        if tool_system_msgs:\n'
              '            latest_msgs = tool_system_msgs[-1:] + latest_msgs\n'
              '    pruned_prompt = _build_prompt(latest_msgs)\n'
          )

          if "tool_system_msgs = [" in text:
              print("上游持久会话已保留工具提示词，无需重复补丁。")
          elif persistent_anchor in text:
              text = text.replace(
                  persistent_anchor,
                  persistent_replacement,
                  1,
              )
              print("已修复持久会话后续轮次丢失工具提示词的问题。")
          else:
              raise SystemExit("无法定位持久会话提示词裁剪逻辑，停止构建。")

          route_file.write_text(text, encoding="utf-8")

          patched = route_file.read_text(encoding="utf-8")
          compile(patched, str(route_file), "exec")

          if (
              "def _increment_thread_count(" not in patched
              and "async def _increment_thread_count(" not in patched
              and call_line in patched
          ):
              raise SystemExit("_increment_thread_count 悬空调用仍然存在，停止构建。")

          if generic_rule_anchor in patched and (
              "6. The listed functions are real client-side tools." not in patched
          ):
              raise SystemExit("工具调用提示词增强未成功应用，停止构建。")

          if responses_anchor in patched:
              raise SystemExit("Responses 仍把工具提示词放在全部系统指令之前，停止构建。")

          if "def _extract_persistent_prompt(" in patched and "tool_system_msgs = [" not in patched:
              raise SystemExit("持久会话后续轮次仍会丢失工具提示词，停止构建。")

          print("CatGPT Gateway 上游兼容性检查通过。")
          PY

          echo "dir=${source_dir}" >> "${GITHUB_OUTPUT}"

      - name: Build and push latest
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.source.outputs.dir }}
          push: true
          pull: true
          platforms: linux/amd64
          tags: ghcr.io/newyorkthink/catgpt-gateway:latest
          labels: |
            org.opencontainers.image.source=https://github.com/newyorkthink/docker_images
            org.opencontainers.image.url=https://github.com/GautamVhavle/CatGPT-Gateway
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha,scope=catgpt-gateway
          cache-to: type=gha,mode=max,scope=catgpt-gateway
          provenance: false
          sbom: false
