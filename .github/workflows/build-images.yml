name: Build Docker Images
run-name: Build Docker Images (${{ inputs.image }})

on:
  workflow_dispatch:
    inputs:
      image:
        description: '选择要构建的镜像（选择 all 构建全部）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hermes-agent
          - paddleocr
          - spoofdpi
          - umi-ocr
          - whisper-cpp

permissions:
  actions: write

jobs:
  dispatch:
    name: Dispatch ${{ matrix.image }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: >-
          ${{ fromJSON(inputs.image == 'all'
          && '["hermes-agent","paddleocr","spoofdpi","umi-ocr","whisper-cpp"]'
          || format('[{0}]', toJSON(inputs.image))) }}
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Dispatch image workflow
        shell: bash
        run: |
          set -Eeuo pipefail

          case "${IMAGE}" in
            hermes-agent|paddleocr|spoofdpi|umi-ocr|whisper-cpp) ;;
            *)
              printf '未知镜像：%s\n' "${IMAGE}" >&2
              exit 1
              ;;
          esac

          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${IMAGE}.yml/dispatches" \
            -f ref=main
