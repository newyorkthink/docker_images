name: Build Umi-OCR

on:
  push:
    branches:
      - main
    paths:
      - 'umi-ocr/**'
      - '.github/workflows/umi-ocr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Umi-OCR
        uses: docker/build-push-action@v7
        with:
          context: ./umi-ocr
          file: ./umi-ocr/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/newyorkthink/umi-ocr:latest
          labels: org.opencontainers.image.source=https://github.com/newyorkthink/docker_images
          cache-from: type=gha,scope=umi-ocr
          cache-to: type=gha,mode=max,scope=umi-ocr
